<h1>Activity Summary</h1>
<div id="table-container"></div>

<script>
    const generateTableHtml = (items) => {
        const headers = [
            "Username", "Total", "Tasks Added", "Leads Added",
            "Status Updates", "Dialed", "Won"
        ];

        const keys = [
            "_id", "count", "task_added", "lead_added",
            "status_updated",
            "dialed", "won"
        ];

        const rows = items.map(item => {
            return `<tr>${keys.map(k => `<td>${item[k]}</td>`).join('')}</tr>`;
        }).join('');

        return `
                <table>
                    <thead>
                        <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
    };

    const sampleData = [
        {
            _id: "johndoe",
            count: 25,
            task_added: 5,
            lead_added: 3,
            note_added: 7,
            followup_added: 2,
            status_updated: 4,
            completed: 2,
            dialed: 10,
            won: 1
        },
        {
            _id: "janedoe",
            count: 18,
            task_added: 2,
            lead_added: 4,
            note_added: 3,
            followup_added: 1,
            status_updated: 5,
            completed: 1,
            dialed: 8,
            won: 2
        }
    ];

    document.getElementById('table-container').innerHTML = generateTableHtml(sampleData);
</script>
