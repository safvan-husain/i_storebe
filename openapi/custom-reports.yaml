openapi: 3.0.3
info:
  title: Custom Reports API
  version: 1.0.0
  description: Endpoints for creating, publishing, and listing custom reports with latest version.
servers:
  - url: /api
paths:
  /custom-reports:
    get:
      summary: List reports (latest version only)
      description: Returns reports available to the requester. Admins receive all published reports. Non-admins receive only reports where both prvilege and SecondPrivileage match the requester. Each item includes only the latest version's questions.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LatestReport'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create report (draft)
      description: Creates a new draft report. Initial questions are optional; versions are created via publish endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /custom-reports/{id}/publish:
    post:
      summary: Publish new version
      description: Publishes a new immutable version with the provided questions. Question and option ids are generated server-side.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Report id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishVersionRequest'
      responses:
        '201':
          description: Version published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishVersionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Generic
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      type: string
                  message:
                    type: string

    # Enums
    ReportInterval:
      type: string
      enum: [daily, weekly, monthly, yearly]
    QuestionKind:
      type: string
      enum: [choice, choiceMultiSelect, textField, numberField]
    ReportStatus:
      type: string
      enum: [draft, published, archived]

    # Interval config
    IntervalConfig:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ReportInterval'
        times:
          type: array
          description: Milliseconds since epoch
          items:
            type: integer
            format: int64

    # Question input (client → server)
    ChoiceOptionInput:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        description:
          type: string
    BaseQuestionInput:
      type: object
      required: [index, query, kind]
      properties:
        index:
          type: integer
          minimum: 0
        query:
          type: string
        kind:
          $ref: '#/components/schemas/QuestionKind'
        helpText:
          type: string
        required:
          type: boolean
        showIf:
          type: object
          properties:
            questionIndex:
              type: integer
              minimum: 0
            choiceIndexEquals:
              type: integer
              minimum: 0
            exists:
              type: boolean
    ChoiceQuestionInput:
      allOf:
        - $ref: '#/components/schemas/BaseQuestionInput'
        - type: object
          properties:
            kind:
              type: string
              enum: [choice]
            options:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ChoiceOptionInput'
            allowOther:
              type: boolean
            otherAnswerType:
              type: string
              enum: [textField, numberField]
    ChoiceMultiQuestionInput:
      allOf:
        - $ref: '#/components/schemas/BaseQuestionInput'
        - type: object
          properties:
            kind:
              type: string
              enum: [choiceMultiSelect]
            options:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ChoiceOptionInput'
            allowOther:
              type: boolean
            otherAnswerType:
              type: string
              enum: [textField, numberField]
            minSelect:
              type: integer
              minimum: 0
            maxSelect:
              type: integer
              minimum: 1
    TextQuestionInput:
      allOf:
        - $ref: '#/components/schemas/BaseQuestionInput'
        - type: object
          properties:
            kind:
              type: string
              enum: [textField]
            placeholder:
              type: string
            minLength:
              type: integer
              minimum: 0
            maxLength:
              type: integer
              minimum: 0
    NumberQuestionInput:
      allOf:
        - $ref: '#/components/schemas/BaseQuestionInput'
        - type: object
          properties:
            kind:
              type: string
              enum: [numberField]
            min:
              type: number
            max:
              type: number
    AnyQuestionInput:
      oneOf:
        - $ref: '#/components/schemas/ChoiceQuestionInput'
        - $ref: '#/components/schemas/ChoiceMultiQuestionInput'
        - $ref: '#/components/schemas/TextQuestionInput'
        - $ref: '#/components/schemas/NumberQuestionInput'
      discriminator:
        propertyName: kind
        mapping:
          choice: '#/components/schemas/ChoiceQuestionInput'
          choiceMultiSelect: '#/components/schemas/ChoiceMultiQuestionInput'
          textField: '#/components/schemas/TextQuestionInput'
          numberField: '#/components/schemas/NumberQuestionInput'

    # Question (server → client) latest report response
    ChoiceOption:
      type: object
      properties:
        _id:
          type: string
        label:
          type: string
        value:
          type: string
        description:
          type: string
        index:
          type: integer
    BaseQuestion:
      type: object
      properties:
        questionId:
          type: string
        index:
          type: integer
        query:
          type: string
        kind:
          $ref: '#/components/schemas/QuestionKind'
        helpText:
          type: string
        required:
          type: boolean
        showIf:
          type: object
          properties:
            questionIndex:
              type: integer
              minimum: 0
            choiceIndexEquals:
              type: integer
              minimum: 0
            exists:
              type: boolean
    ChoiceQuestion:
      allOf:
        - $ref: '#/components/schemas/BaseQuestion'
        - type: object
          properties:
            kind:
              type: string
              enum: [choice]
            options:
              type: array
              items:
                $ref: '#/components/schemas/ChoiceOption'
            allowOther:
              type: boolean
            otherAnswerType:
              type: string
              enum: [textField, numberField]
    ChoiceMultiQuestion:
      allOf:
        - $ref: '#/components/schemas/BaseQuestion'
        - type: object
          properties:
            kind:
              type: string
              enum: [choiceMultiSelect]
            options:
              type: array
              items:
                $ref: '#/components/schemas/ChoiceOption'
            allowOther:
              type: boolean
            otherAnswerType:
              type: string
              enum: [textField, numberField]
            minSelect:
              type: integer
            maxSelect:
              type: integer
    TextQuestion:
      allOf:
        - $ref: '#/components/schemas/BaseQuestion'
        - type: object
          properties:
            kind:
              type: string
              enum: [textField]
            placeholder:
              type: string
            minLength:
              type: integer
            maxLength:
              type: integer
    NumberQuestion:
      allOf:
        - $ref: '#/components/schemas/BaseQuestion'
        - type: object
          properties:
            kind:
              type: string
              enum: [numberField]
            min:
              type: number
            max:
              type: number
    AnyQuestion:
      oneOf:
        - $ref: '#/components/schemas/ChoiceQuestion'
        - $ref: '#/components/schemas/ChoiceMultiQuestion'
        - $ref: '#/components/schemas/TextQuestion'
        - $ref: '#/components/schemas/NumberQuestion'
      discriminator:
        propertyName: kind
        mapping:
          choice: '#/components/schemas/ChoiceQuestion'
          choiceMultiSelect: '#/components/schemas/ChoiceMultiQuestion'
          textField: '#/components/schemas/TextQuestion'
          numberField: '#/components/schemas/NumberQuestion'

    # Create report
    CreateReportRequest:
      type: object
      required: [title, prvilege]
      properties:
        title:
          type: string
        description:
          type: string
        prvilege:
          type: string
          description: User privilege required to view the report
          example: manager
        SecondPrivileage:
          type: string
          description: Secondary privilege required to view the report
          example: regular
        interval:
          $ref: '#/components/schemas/IntervalConfig'
        questions:
          type: array
          description: Optional initial questions; versioning happens on publish
          items:
            $ref: '#/components/schemas/AnyQuestionInput'
    CreateReportResponse:
      type: object
      properties:
        id:
          type: string

    # Publish version
    PublishVersionRequest:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/AnyQuestionInput'
    PublishVersionResponse:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer

    # Latest report response item
    LatestReport:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        prvilege:
          type: string
        SecondPrivileage:
          type: string
        interval:
          $ref: '#/components/schemas/IntervalConfig'
        status:
          $ref: '#/components/schemas/ReportStatus'
        version:
          type: integer
        questions:
          type: array
          items:
            $ref: '#/components/schemas/AnyQuestion'
        publishedAt:
          type: integer
          format: int64
