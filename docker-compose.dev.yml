services:
  mongo:
    image: mongo:8.0
    container_name: istore-dev-mongo
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init/01-restore-production-backup.sh:/docker-entrypoint-initdb.d/01-restore-production-backup.sh:ro
      - ../mongodb-backup-2026-08-27T18-49-03-907193.archive.gz:/backup/production.archive.gz:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: istore-dev-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/i-store-db
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules

  mongo-restore:
    image: mongo:8.0
    profiles:
      - restore
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ../mongodb-backup-2026-08-27T18-49-03-907193.archive.gz:/backup/archive.gz:ro
    command: >
      bash -lc "mongorestore
      --uri=mongodb://mongo:27017
      --archive=/backup/archive.gz
      --gzip
      --drop
      --nsInclude='i-store-db.*'"

volumes:
  mongo_data:
  api_node_modules:
